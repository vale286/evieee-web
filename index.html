<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>evieee-web</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <!-- Cinematic Story Intro -->
    <div id="story-intro" class="fixed inset-0 z-[99999] bg-[#0a192f] flex flex-col justify-center items-center p-8 transition-opacity duration-1000">
        <div class="w-full max-w-2xl text-cyan-400 font-mono text-sm md:text-base leading-relaxed mb-8 h-32" id="terminal-text">
            <!-- Typing effect will go here -->
        </div>
        
        <div id="evieee-welcome" class="hidden flex-col items-center opacity-0 transition-opacity duration-1000">
            <div class="bg-slate-800/80 backdrop-blur-md border border-cyan-400 p-6 rounded-lg text-white max-w-xl text-center mb-6 shadow-[0_0_15px_rgba(34,211,238,0.2)]">
                <h2 class="text-cyan-400 font-bold mb-3 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    EvIEEE AI Online
                    <button id="btn-read-intro" class="ml-3 text-cyan-400 hover:text-white transition-colors flex items-center gap-1 text-xs bg-cyan-900/30 px-2 py-1 rounded border border-cyan-400/50" title="Turn on Narrator">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707A1 1 0 0015 19V5a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                        </svg>
                        Narrator
                    </button>
                </h2>
                <p id="evieee-intro-text" class="text-sm md:text-base">"Welcome, Commander. Our telemetry shows severe ecosystem degradation across the archipelago. We need your strategic guidance to mitigate these disasters. The digital twin of Nusantara is now online."</p>
            </div>
            <button id="btn-enter-map" class="px-8 py-3 bg-transparent border-2 border-cyan-400 text-cyan-400 font-bold rounded hover:bg-cyan-400 hover:text-[#0a192f] transition-all tracking-widest uppercase">
                Initialize Map
            </button>
        </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const storyIntro = document.getElementById('story-intro');
        
        // Skip intro if user has already seen it and clicked through
        if (localStorage.getItem('evieee_skip_intro') === 'true') {
            if (storyIntro) storyIntro.style.display = 'none';
            return;
        }

        const terminalText = document.getElementById('terminal-text');
        const evieeeWelcome = document.getElementById('evieee-welcome');
        const btnEnterMap = document.getElementById('btn-enter-map');

        const lines = [
            "> CONNECTING TO NUSANTARA ECO-DEFENSE GRID...",
            "> SCANNING SPATIAL DATA...",
            "> WARNING: CRITICAL ENVIRONMENTAL ANOMALIES DETECTED.",
            "> INITIALIZING AI ASSISTANT 'EvIEEE'..."
        ];

        let lineIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    terminalText.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 40); // Typing speed
                } else {
                    terminalText.innerHTML += "<br><br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 500); // Delay between lines
                }
            } else {
                // Finished typing, show EvIEEE
                setTimeout(() => {
                    evieeeWelcome.classList.remove('hidden');
                    evieeeWelcome.classList.add('flex');
                    // Trigger fade in
                    setTimeout(() => evieeeWelcome.classList.remove('opacity-0'), 50);
                }, 500);
            }
        }

        // Start the typing effect
        setTimeout(typeWriter, 1000);

        // Enter Map Button
        if (btnEnterMap) {
            btnEnterMap.addEventListener('click', () => {
                storyIntro.classList.add('opacity-0');
                setTimeout(() => {
                    storyIntro.style.display = 'none';
                }, 1000); // Wait for fade out
            });
        }

        // Narrator Button
        const btnReadIntro = document.getElementById('btn-read-intro');
        if (btnReadIntro) {
            btnReadIntro.addEventListener('click', () => {
                const textToRead = document.getElementById('evieee-intro-text').innerText;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                
                // Try to find a female voice
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => 
                    v.name.toLowerCase().includes('female') || 
                    v.name.toLowerCase().includes('zira') || 
                    v.name.toLowerCase().includes('samantha') || 
                    v.name.toLowerCase().includes('victoria')
                );
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            });
        }
    });
    </script>
  </body>
</html>
